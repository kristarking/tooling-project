name: CI/CD Pipeline (Azure AKS + ACR)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: tooling-web
  NAMESPACE: tooling

jobs:
  # 1. Terraform for infrastructure names
  
  terraform-outputs:
    name: Infrastructure Discovery
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.tf.outputs.acr_name }}
      acr_login_server: ${{ steps.tf.outputs.acr_login_server }}
      aks_cluster_name: ${{ steps.tf.outputs.aks_cluster_name }}
      resource_group: ${{ steps.tf.outputs.resource_group }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init & Output
        id: tf
        working-directory: terraform
        run: |
          terraform init
          echo "acr_name=$(terraform output -raw acr_name)" >> $GITHUB_OUTPUT
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)" >> $GITHUB_OUTPUT
          echo "resource_group=$(terraform output -raw aks_resource_group)" >> $GITHUB_OUTPUT
 
  # 2. LINT: Check Dockerfile and Helm chart
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error  # CHANGED THIS from warning to error
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0' # Pinned version for stability
      
      - name: Lint Helm Chart
        run: |
          cd helm/tooling-web
          helm lint .

  # 3. BUILD & INTEGRATION TEST: Verify app + database

  build-test:
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: [lint, terraform-outputs]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build local test image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tooling-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Test Environment
        run: |
          docker run -d --name test-db \
            -e MYSQL_ROOT_PASSWORD=test \
            -e MYSQL_DATABASE=tooling \
            -e MYSQL_USER=admin \
            -e MYSQL_PASSWORD=test \
            mysql:5.7
          
          echo "Waiting for MySQL..."
          sleep 20
          
          docker run -d --name test-web \
            --link test-db:db \
            -e DB_HOST=db \
            -e DB_NAME=tooling \
            -e DB_USER=admin \
            -e DB_PASSWORD=test \
            -p 8080:80 \
            tooling-web:test
          
          echo "Waiting for application..."
          sleep 15

      - name: Health Check
        run: |
          curl -f http://localhost:8080/ || exit 1
          echo "Health check passed!"

      - name: Cleanup
        if: always()
        run: |
          docker stop test-web test-db || true
          docker rm test-web test-db || true

  # 4. SCAN: Vulnerability scanning

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tooling-web:scan
          cache-from: type=gha

      - name: Run Trivy (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tooling-web:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy (Fail on High/Critical)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tooling-web:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # 5. SHIP: Push to Azure Container Registry

  build-push:
    name: Push to ACR
    runs-on: ubuntu-latest
    needs: [security-scan, terraform-outputs]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: ACR Login
        run: az acr login --name ${{ needs.terraform-outputs.outputs.acr_name }}
      
      - name: Generate Image Tag
        id: tag
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"
      
      - name: Build & Push
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          REPO=${{ needs.terraform-outputs.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}
          
          docker build -t $REPO:$TAG -t $REPO:latest .
          docker push $REPO:$TAG
          docker push $REPO:latest
          
          echo "Pushed: $REPO:$TAG"
          echo "Pushed: $REPO:latest"

  # 6. DEPLOY: Helm update to AKS

  deploy:
    name: Deploy to AKS with Helm
    runs-on: ubuntu-latest
    needs: [build-push, terraform-outputs]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ needs.terraform-outputs.outputs.resource_group }}
          cluster-name: ${{ needs.terraform-outputs.outputs.aks_cluster_name }}

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Prepare Helm Chart
        run: |
          cd helm/tooling-web
          
          # Copy SQL initialization file
          mkdir -p files
          cp ../../tooling-db.sql files/init.sql || echo "⚠️ SQL file not found"
          
          # Update dependencies (if chart has them)
          helm dependency update || echo "No dependencies"

      - name: Create Namespaces
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update Secrets
        run: |
          # Database secrets
          kubectl create secret generic tooling-db-secret \
            --from-literal=root-password='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            --from-literal=database='tooling' \
            --from-literal=username='admin' \
            --from-literal=password='${{ secrets.MYSQL_PASSWORD }}' \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Secrets created/updated"

      - name: Deploy Application with Helm
        run: |
          TAG=${{ needs.build-push.outputs.image_tag }}
          
          helm upgrade --install tooling-web ./helm/tooling-web \
            --namespace ${{ env.NAMESPACE }} \
            --set image.repository=${{ needs.terraform-outputs.outputs.acr_login_server }}/${{ env.IMAGE_NAME }} \
            --set image.tag=$TAG \
            --set database.host=tooling-db-service \
            --wait \
            --timeout 10m
          
          echo "Application deployed"

      - name: Verify Deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment/tooling-web-web -n ${{ env.NAMESPACE }} --timeout=5m
          
          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }}
          
          echo ""
          echo "Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Install Nginx Ingress Controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --set controller.service.type=LoadBalancer \
            --set controller.service.externalTrafficPolicy=Local \
            --wait \
            --timeout 5m
          
          echo "Ingress controller installed"

      - name: Install Monitoring Stack (Prometheus & Grafana)
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.enabled=true \
            --set grafana.service.type=LoadBalancer \
            --set prometheus.prometheusSpec.retention=7d \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --wait \
            --timeout 10m
          
          echo "Monitoring stack installed"
          echo "Grafana password stored in secret: prometheus-grafana"

      - name: Display Access Information
        run: |
          echo "==============================================="
          echo "Deployment Complete!"
          echo "==============================================="
          echo ""
          echo "Application:"
          APP_IP=$(kubectl get svc -n ${{ env.NAMESPACE }} -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "   External IP: ${APP_IP}"
          echo "   Command: kubectl get svc -n ${{ env.NAMESPACE }}"
          echo ""
          echo "Grafana:"
          GRAFANA_IP=$(kubectl get svc -n monitoring prometheus-grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "   External IP: ${GRAFANA_IP}"
          echo "   Username: admin"
          echo "   Password: (from secret GRAFANA_PASSWORD)"
          echo "   Command: kubectl get svc -n monitoring"
          echo ""
          echo "Prometheus:"
          echo "   Port-forward: kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090"
          echo ""
          echo "View Logs:"
          echo "   kubectl logs -f deployment/tooling-web-web -n ${{ env.NAMESPACE }}"
          echo "==============================================="

  # 7. SMOKE TESTS: Verify deployment is working
  
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy, terraform-outputs]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ needs.terraform-outputs.outputs.resource_group }}
          cluster-name: ${{ needs.terraform-outputs.outputs.aks_cluster_name }}

      - name: Wait for Pods to be Ready
        run: |
          echo "Waiting for application pods..."
          kubectl wait --for=condition=ready pod -l app=tooling-web-web \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s || echo "Timeout waiting for pods"

      - name: Test Application Endpoint
        run: |
          echo "Running smoke tests..."
          
          # Try to get external IP
          EXTERNAL_IP=$(kubectl get svc -n ${{ env.NAMESPACE }} -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          
          if [ -z "$EXTERNAL_IP" ] || [ "$EXTERNAL_IP" == "null" ]; then
            echo "LoadBalancer IP not ready, using port-forward..."
            kubectl port-forward -n ${{ env.NAMESPACE }} svc/tooling-web-service 8080:80 &
            sleep 5
            TEST_URL="http://localhost:8080"
          else
            TEST_URL="http://${EXTERNAL_IP}"
          fi
          
          echo "Testing: ${TEST_URL}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${TEST_URL} || echo "000")
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "Smoke test passed! (HTTP $HTTP_CODE)"
          else
            echo "Smoke test failed! (HTTP $HTTP_CODE)"
            kubectl get pods -n ${{ env.NAMESPACE }}
            kubectl logs -l app=tooling-web-web -n ${{ env.NAMESPACE }} --tail=50
            exit 1
          fi