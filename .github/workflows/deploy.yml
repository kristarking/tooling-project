name: CI/CD Pipeline (Azure AKS + ACR)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: tooling-web
  NAMESPACE: tooling

jobs:
  # 1. Terraform for infrastructure names
  
  terraform-outputs:
    name: Infrastructure Discovery
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.tf.outputs.acr_name }}
      acr_login_server: ${{ steps.tf.outputs.acr_login_server }}
      aks_cluster_name: ${{ steps.tf.outputs.aks_cluster_name }}
      resource_group: ${{ steps.tf.outputs.resource_group }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform with Azure Credentials
        run: |
          echo "${{ secrets.AZURE_CREDENTIALS }}" > azure_creds.json
          echo "ARM_CLIENT_ID=$(jq -r .clientId azure_creds.json)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(jq -r .clientSecret azure_creds.json)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId azure_creds.json)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(jq -r .tenantId azure_creds.json)" >> $GITHUB_ENV
          rm azure_creds.json
      
      - uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init & Output
        id: tf
        working-directory: terraform
        run: |
          terraform init
          echo "acr_name=$(terraform output -raw acr_name)" >> $GITHUB_OUTPUT
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)" >> $GITHUB_OUTPUT
          echo "resource_group=$(terraform output -raw aks_resource_group)" >> $GITHUB_OUTPUT
 
  # 2. BUILD & INTEGRATION TEST: Verify app + database

  build-test:
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: [terraform-outputs]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build local test image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tooling-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Test Environment
        run: |
          docker run -d --name test-db \
            -e MYSQL_ROOT_PASSWORD=test \
            -e MYSQL_DATABASE=tooling \
            -e MYSQL_USER=admin \
            -e MYSQL_PASSWORD=test \
            mysql:5.7
          
          echo "Waiting for MySQL..."
          sleep 20
          
          docker run -d --name test-web \
            --link test-db:db \
            -e DB_HOST=db \
            -e DB_NAME=tooling \
            -e DB_USER=admin \
            -e DB_PASSWORD=test \
            -p 8080:80 \
            tooling-web:test
          
          echo "Waiting for application..."
          sleep 15

      - name: Health Check
        run: |
          curl -f http://localhost:8080/ || exit 1
          echo "✅ Health check passed!"

      - name: Cleanup
        if: always()
        run: |
          docker stop test-web test-db || true
          docker rm test-web test-db || true

  # 3. SCAN: Vulnerability scanning

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tooling-web:scan
          cache-from: type=gha

      - name: Run Trivy (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tooling-web:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy (Table format - informational only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tooling-web:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

  # 4. SHIP: Push to Azure Container Registry

  build-push:
    name: Push to ACR
    runs-on: ubuntu-latest
    needs: [security-scan, terraform-outputs]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: ACR Login
        run: az acr login --name ${{ needs.terraform-outputs.outputs.acr_name }}
      
      - name: Generate Image Tag
        id: tag
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${TAG}"
      
      - name: Build & Push
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          REPO=${{ needs.terraform-outputs.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}
          
          docker build -t $REPO:$TAG -t $REPO:latest .
          docker push $REPO:$TAG
          docker push $REPO:latest
          
          echo "✅ Pushed: $REPO:$TAG"
          echo "✅ Pushed: $REPO:latest"

  # 5. DEPLOY: Helm update to AKS

  deploy:
    name: Deploy to AKS with Helm
    runs-on: ubuntu-latest
    needs: [build-push, terraform-outputs]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ needs.terraform-outputs.outputs.resource_group }}
          cluster-name: ${{ needs.terraform-outputs.outputs.aks_cluster_name }}

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Create Namespaces
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update Secrets
        run: |
          kubectl create secret generic tooling-db-secret \
            --from-literal=root-password='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            --from-literal=database='tooling' \
            --from-literal=username='admin' \
            --from-literal=password='${{ secrets.MYSQL_PASSWORD }}' \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "✅ Secrets created/updated"

      - name: Deploy Application with Helm
        run: |
          TAG=${{ needs.build-push.outputs.image_tag }}
          
          helm upgrade --install tooling-web ./helm/tooling-web \
            --namespace ${{ env.NAMESPACE }} \
            -f ./helm/tooling-web/values.yaml \
            --set image.repository=${{ needs.terraform-outputs.outputs.acr_login_server }}/${{ env.IMAGE_NAME }} \
            --set image.tag=$TAG \
            --wait \
            --timeout 10m
          
          echo "✅ Application deployed"

      - name: Verify Deployment
        run: |
          echo "📊 Checking deployment status..."
          kubectl rollout status deployment/tooling-web-web -n ${{ env.NAMESPACE }} --timeout=5m
          
          echo ""
          echo "📦 Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }}
          
          echo ""
          echo "🌐 Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Install Nginx Ingress Controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --set controller.service.type=LoadBalancer \
            --wait \
            --timeout 5m
          
          echo "✅ Ingress controller installed"

      - name: Install Monitoring Stack
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.enabled=true \
            --set grafana.service.type=LoadBalancer \
            --set prometheus.prometheusSpec.retention=7d \
            --wait \
            --timeout 10m
          
          echo "✅ Monitoring stack installed"

      - name: Display Access Information
        run: |
          echo "==============================================="
          echo "🎉 Deployment Complete!"
          echo "==============================================="
          APP_IP=$(kubectl get svc -n ${{ env.NAMESPACE }} -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "Application: ${APP_IP}"
          echo "==============================================="