name: 'Gemini Dispatch'

on:
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  issue_comment:
    types:
      - 'created'

permissions: {}

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    if: |-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body || github.event.review.body, '@gemini-cli /review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      additional_context: '${{ steps.extract_context.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
    steps:
      - name: 'Extract context'
        id: 'extract_context'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          REQUEST: '${{ github.event.comment.body || github.event.review.body }}'
        with:
          script: |
            const request = process.env.REQUEST;
            const additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
            core.setOutput('additional_context', additionalContext);

      - name: 'Acknowledge request'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            Hi @${{ github.actor }}, I have received your review request and I am working on it. You can follow progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

  review:
    needs: 'dispatch'
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets:
      GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'

  notify-failure:
    needs:
      - 'dispatch'
      - 'review'
    if: |-
      ${{ always() && needs.review.result == 'failure' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Send failure comment'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.dispatch.outputs.issue_number }}'
          MESSAGE: |-
            Sorry @${{ github.actor }}, the review failed. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"
